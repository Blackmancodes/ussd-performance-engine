services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"

  engine:
    build: .
    command: ["-role", "coordinator", "-config", "/config/docker.yaml", "-sessions", "1000000", "-worker-count", "2", "-metrics-addr", ":2112", "-mock", "-mock-error-rate", "0.1"]
    ports:
      - "2112:2112"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - engine

  grafana:
    image: grafana/grafana:11.2.0
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GRAFANA_ALERT_EMAIL: "${GRAFANA_ALERT_EMAIL:-alerts@example.com}"
      GF_SMTP_ENABLED: "${GF_SMTP_ENABLED:-false}"
      GF_SMTP_HOST: "${GF_SMTP_HOST:-}"
      GF_SMTP_USER: "${GF_SMTP_USER:-}"
      GF_SMTP_PASSWORD: "${GF_SMTP_PASSWORD:-}"
      GF_SMTP_FROM_ADDRESS: "${GF_SMTP_FROM_ADDRESS:-alerts@example.com}"
      GF_SMTP_FROM_NAME: "${GF_SMTP_FROM_NAME:-USSD Pulse Command Center}"
    depends_on:
      - prometheus