$kind: http-request
method: POST
url: '{{base_url}}/api/v1/send'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "sessionId": "postman-demo-1",
      "msisdn": "2348031000001",
      "network": "MTN",
      "ussdString": "*737#",
      "input": "",
      "stage": "begin"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response body has sessionId field", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("sessionId");
      });

      pm.test("sessionId matches the request", function () {
          const json = pm.response.json();
          pm.expect(json.sessionId).to.eql("postman-demo-1");
      });

      pm.test("Response body has response field", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("response");
      });

      pm.test("Response body has continue field of type boolean", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("continue");
          pm.expect(json["continue"]).to.be.a("boolean");
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response time is under 500ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });
