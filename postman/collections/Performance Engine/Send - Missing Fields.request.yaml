$kind: http-request
name: 'Send - Missing Fields'
method: POST
url: '{{base_url}}/api/v1/send'
order: 3100
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 502", function () {
          pm.response.to.have.status(502);
      });

      pm.test("Response body has error field", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("error");
      });

      pm.test("Error message indicates upstream sender failure", function () {
          const json = pm.response.json();
          pm.expect(json.error.toLowerCase()).to.include("sender");
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response time is under 500ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });
