$kind: http-request
name: 'Receive - Invalid JSON'
method: POST
url: '{{base_url}}/api/v1/receive'
order: 2200
headers:
  - key: Content-Type
    value: application/json
body:
  type: text
  content: not-json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Response body has error field", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("error");
      });

      pm.test("Error message indicates invalid JSON", function () {
          const json = pm.response.json();
          pm.expect(json.error.toLowerCase()).to.include("invalid");
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response time is under 500ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });
