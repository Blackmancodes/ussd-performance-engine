$kind: http-request
url: "{{base_url}}/api/v1/send"
method: POST
headers:
  Content-Type: application/json
  X-API-Key: "{{api_key}}"
body:
  type: json
  content: |-
    {
      "sessionId": "postman-demo-1",
      "msisdn": "2348031000001",
      "network": "MTN",
      "ussdString": "*737#",
      "input": "",
      "stage": "begin"
    }
scripts:
  - type: afterResponse
    code: pm.test('forwards request and returns receiver response', function () { pm.response.to.have.status(200); pm.expect(pm.response.json().sessionId).to.eql('postman-demo-1'); pm.expect(pm.response.json().continue).to.eql(false); });
    language: text/javascript
order: 5000
