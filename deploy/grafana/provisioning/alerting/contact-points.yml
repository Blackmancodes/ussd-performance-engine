apiVersion: 1

contactPoints:
  - orgId: 1
    name: USSD email alerts
    receivers:
      - uid: ussd-email
        type: email
        settings:
          addresses: "$__env{GRAFANA_ALERT_EMAIL}"
          singleEmail: true
          subject: '{{ template "ussd.alert.subject" . }}'
          message: '{{ template "ussd.alert.message" . }}'
        disableResolveMessage: false
